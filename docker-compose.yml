# Local development infrastructure for AdoptaFacil.
# Only backing services live here — no application containers in Sprint 0.
#   docker compose up -d
# Postgres and Redis expose healthchecks so `depends_on: condition: service_healthy`
# and CI can wait for readiness deterministically.
services:
  postgres:
    image: postgres:16
    container_name: adoptafacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adoptafacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adoptafacil}
      POSTGRES_DB: ${POSTGRES_DB:-adoptafacil}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-adoptafacil} -d ${POSTGRES_DB:-adoptafacil}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: adoptafacil-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Bandeja de correo local: la API envía por SMTP a localhost:1025 y los
  # correos (invitaciones, solicitudes de firma, recuperar contraseña) se leen
  # en http://localhost:8025. Nada sale a Internet. `pnpm setup:demo-env`
  # apunta el .env aquí si no configuraste un SMTP propio.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: adoptafacil-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  postgres_data:
    name: adoptafacil_postgres_data
  redis_data:
    name: adoptafacil_redis_data
