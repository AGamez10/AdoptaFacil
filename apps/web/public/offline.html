<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d37" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · AdoptaFácil</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #ffffff;
        color: #1b2a3a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 120px;
        height: 120px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 16px 0 8px;
        color: #0b3d37;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background: #0b3d37;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>No hay conexión</h1>
      <p>
        Revisa tu internet. Cuando vuelvas a estar en línea, AdoptaFácil seguirá donde la dejaste.
      </p>
      <a href="">Reintentar</a>
    </main>
  </body>
</html>
