# Gates de seguridad del repositorio (R1-10; §7.6 del prompt maestro).
# Complementa a ci.yml (calidad + integración + postura RLS + deriva).
#   - secrets:   gitleaks sobre TODA la historia, con .gitleaks.toml.
#   - deps:      pnpm audit de runtime; crítica o alta = rojo. Informe completo
#                (incluidas devDependencies) en el resumen, sin bloquear.
#   - semgrep:   reglas propias de SQL injection (.semgrep/).
# Corre en cada PR, en push a main / integracion/mvp-1-0 y una vez al día
# (06:00 hora Colombia) para detectar CVE nuevos sobre código que no cambió.
name: Security

on:
  push:
    branches: [main, integracion/mvp-1-0]
  pull_request:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Máquina de cada job: variable CI_RUNS_ON, igual que en ci.yml.
jobs:
  secrets:
    name: gitleaks (historia completa)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      GITLEAKS_VERSION: 8.24.3
      # sha256 de gitleaks_8.24.3_linux_x64.tar.gz (checksums.txt del release oficial).
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (versión fijada y verificada)
        run: |
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          # Sin sudo: un runner propio no tiene por qué darle root al job.
          mkdir -p "$RUNNER_TEMP/bin" && mv gitleaks "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  deps:
    name: pnpm audit (runtime bloquea en alta/crítica)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Full audit report (no bloquea)
        run: |
          pnpm audit --json > audit-all.json || true
          node -e '
            const m = require("./audit-all.json").metadata.vulnerabilities;
            const line = `Árbol completo (incluye devDependencies): crítica ${m.critical}, alta ${m.high}, moderada ${m.moderate}, baja ${m.low}`;
            console.log(line);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### pnpm audit\n\n${line}\n\n`);
          '

      - name: Runtime audit (bloquea en alta o crítica)
        run: pnpm audit --prod --audit-level high

  semgrep:
    name: semgrep (SQL injection)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep (versión fijada)
        run: python -m pip install --disable-pip-version-check semgrep==1.179.0

      - name: Scan runtime code
        run: >
          semgrep scan --config .semgrep --error --metrics=off
          --exclude '*.spec.ts' --exclude '*.integration-spec.ts' --exclude 'test'
          apps packages scripts
