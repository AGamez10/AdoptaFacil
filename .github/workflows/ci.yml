name: CI

on:
  push:
    branches: [main, integracion/mvp-1-0]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Máquina donde corren los jobs: variable de repositorio CI_RUNS_ON (JSON).
#   - sin definir            -> "ubuntu-latest" (máquinas de GitHub, consumen minutos)
#   - ["self-hosted","linux"] -> runner propio en WSL2 (docs/operacion/runner-propio.md)
# Los puertos de los servicios no chocan con el Postgres (5433) ni el Redis
# (6379) de desarrollo, porque en un runner propio se publican en el equipo.
jobs:
  quality:
    name: Lint · Typecheck · Build · Unit tests
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint + typecheck
        run: pnpm turbo run lint typecheck

      - name: Build (api + web)
        run: pnpm turbo run build

      # En un runner propio más lento (ver docs/operacion/runner-propio.md),
      # jest y vitest abren un proceso por núcleo: compiten por la CPU (pruebas
      # de UI que pasan de los 5 s) y pueden dejar sin memoria la VM de WSL,
      # que se lleva el runner. Se corren de a un paquete, con pocos procesos y
      # más margen. A vitest se le limita por variables de entorno porque
      # `--maxWorkers` rompe su validación de hilos.
      - name: Unit tests (jest + vitest)
        env:
          VITEST_MAX_FORKS: '2'
          VITEST_MIN_FORKS: '1'
          VITEST_MAX_THREADS: '2'
          VITEST_MIN_THREADS: '1'
        run: |
          pnpm turbo run test --concurrency=1 --filter='!@adoptafacil/api' -- --testTimeout=30000
          pnpm --filter @adoptafacil/api run test --testTimeout=30000 --maxWorkers=2

  rls-no-leak:
    name: rls-no-leak · postura RLS · deriva de esquema (RNF03 gate)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adoptafacil
          POSTGRES_PASSWORD: adoptafacil
          POSTGRES_DB: adoptafacil
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U adoptafacil -d adoptafacil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://adoptafacil:adoptafacil@localhost:55432/adoptafacil?schema=public
      # Misma base sin el parámetro ?schema= de Prisma (psql lo rechaza).
      PG_URL: postgresql://adoptafacil:adoptafacil@localhost:55432/adoptafacil
      DATABASE_URL_APP: postgresql://adoptafacil_app:adoptafacil_app@localhost:55432/adoptafacil?schema=public
      REDIS_URL: redis://localhost:56379
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (creates tables, RLS policy, app role)
        run: pnpm prisma migrate deploy

      # AF-004: toda tabla con organization_id con ENABLE + FORCE + policy, rol
      # de runtime sin SUPERUSER/BYPASSRLS ni dueño, SECURITY DEFINER con
      # search_path fijo y sin SQL dinámico. Cubre automáticamente tablas nuevas.
      - name: RLS posture
        run: psql "$PG_URL" -v ON_ERROR_STOP=1 -f scripts/ci/rls-posture.sql

      # AF-018: prisma/schema debe declarar lo que crean las migraciones
      # (trinquete sobre la deriva heredada; ver el script).
      - name: Schema drift
        env:
          SHADOW_DATABASE_URL: postgresql://adoptafacil:adoptafacil@localhost:55432/adoptafacil_shadow
        run: |
          psql "$PG_URL" -c 'CREATE DATABASE adoptafacil_shadow'
          scripts/ci/schema-drift.sh

      # En partes (cada una en su propio proceso): en una sola corrida la
      # memoria de jest crece suite a suite y, en un runner propio con poca
      # RAM, termina sin memoria y vuelve lentas las colas de correo.
      - name: Integration + RLS no-leak (smoke /health + cross-org isolation)
        run: |
          for shard in 1/4 2/4 3/4 4/4; do
            pnpm --filter @adoptafacil/api run test:integration --shard=$shard --testTimeout=120000
          done

  docker:
    name: Imágenes Docker + compose de producción (arranque de punta a punta)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Proyecto propio por corrida: en un runner propio el stack de desarrollo
    # (nombre "adoptafacil") comparte volúmenes y deja una base con otra clave.
    env:
      COMPOSE_PROJECT_NAME: adoptafacil-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # Secretos de usar y tirar: solo viven en este job.
      - name: Generate throwaway deploy/.env
        run: |
          {
            echo "RELEASE=ci-${GITHUB_SHA::7}"
            echo "APP_DOMAIN=localhost"
            echo "ACME_EMAIL=ci@example.com"
            echo "POSTGRES_USER=adoptafacil"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=adoptafacil"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SIGNATURE_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            # Portales por subdominio con la CA interna de Caddy (sin DNS real).
            echo "PORTALS_TLS=internal"
            echo "VITE_PORTAL_BASE_DOMAIN=localhost"
          } > deploy/.env
          # Integraciones con los valores seguros del ejemplo; el SMTP es un
          # destino ficticio (la API no conecta al arrancar).
          {
            grep -E '^[A-Z_]+=' deploy/api.env.example
            echo "SMTP_HOST=smtp.invalid"
            echo "SMTP_PORT=465"
            echo "SMTP_USER=ci"
            echo "SMTP_PASS=$(openssl rand -hex 16)"
            echo "SMTP_FROM=ci@example.com"
          } > deploy/api.env

      # Proyecto propio de compose (`-p adoptafacil-ci`): en un runner propio,
      # el nombre por defecto `adoptafacil` coincide con la pila de desarrollo
      # local (docker-compose.yml) y `down -v` borraría sus volúmenes.
      - name: docker compose config
        run: docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env config --quiet

      - name: Build images (api, migrate, edge)
        run: docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env build

      # migrate (migraciones + rotación del rol + postura RLS) -> api sana -> Caddy.
      - name: Start stack
        run: docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env up -d --wait --wait-timeout 300

      - name: Smoke test through Caddy (HTTPS)
        run: |
          curl -fsSk https://localhost/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsSk -o /dev/null https://localhost/
          curl -fsSkI https://localhost/ | grep -qi '^strict-transport-security:'
          # Portal en <org>.APP_DOMAIN: mismo origen para el SPA y /api (VITE_API_URL=/api).
          curl -fsSk --resolve demo.localhost:443:127.0.0.1 https://demo.localhost/api/health | grep -q '"status":"ok"'
          curl -fsSk --resolve demo.localhost:443:127.0.0.1 -o /dev/null https://demo.localhost/
          # www redirige al dominio principal.
          test "$(curl -sk --resolve www.localhost:443:127.0.0.1 -o /dev/null -w '%{http_code} %{redirect_url}' https://www.localhost/x)" = "301 https://localhost/x"
          # Solo Caddy publica puertos: Postgres, Redis y la API quedan en redes internas.
          test -z "$(docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env ps --format '{{.Service}} {{.Publishers}}' | grep -v '^caddy' | grep -E '0\.0\.0\.0|::' || true)"

      # Producción usa PORTALS_TLS=cloudflare o namecheap: compila Caddy con cada
      # módulo DNS y valida el Caddyfile con ese bloque (sin emitir certificados).
      - name: Caddy con módulos DNS (build + validate)
        run: |
          for provider in cloudflare namecheap; do
            docker build -f deploy/docker/web.Dockerfile --target "caddy-$provider" -t "adoptafacil-caddy-$provider:ci" .
            docker run --rm -v "$PWD/deploy:/etc/caddy:ro" -e APP_DOMAIN=adoptafacil.example \
              -e ACME_EMAIL=ci@example.com -e PORTALS_TLS="$provider" -e CLOUDFLARE_API_TOKEN="$(openssl rand -hex 20)" \
              -e NAMECHEAP_API_USER=ci -e NAMECHEAP_API_KEY=ci-dummy -e NAMECHEAP_CLIENT_IP=192.0.2.1 \
              "adoptafacil-caddy-$provider:ci" caddy validate --config /etc/caddy/Caddyfile
          done

      - name: Logs on failure
        if: failure()
        run: docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env logs --no-color --tail 200

      # En un runner propio la pila quedaría corriendo en el equipo: se baja siempre.
      - name: Stop stack
        if: always()
        run: docker compose -p adoptafacil-ci -f deploy/compose.yaml --env-file deploy/.env down -v --remove-orphans || true
